<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Just For You ❤️</title>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;

    background:
        radial-gradient(circle at top, #ffc1d6, transparent 35%),
        linear-gradient(135deg, #ff416c, #ff4b2b);
}

/* WELCOME */

#welcomeScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.welcomeBox {
    width: 100%;
    max-width: 430px;
    padding: 35px 25px;
    text-align: center;

    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 30px;

    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

.bigHeart {
    font-size: 70px;
    animation: heartbeat 1.3s infinite;
}

@keyframes heartbeat {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}

.welcomeBox h1 {
    font-size: 34px;
    margin: 15px 0;
}

.welcomeBox p {
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 20px;
}

.inputBox {
    width: 100%;
    padding: 15px 20px;
    margin: 8px 0;

    border: none;
    outline: none;
    border-radius: 30px;

    font-size: 16px;
    text-align: center;

    background: white;
    color: #333;
}

.continueBtn {
    margin-top: 15px;
    padding: 15px 35px;

    border: none;
    border-radius: 50px;

    background: #ff1744;
    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
}

#errorMessage {
    display: none;
    color: white;
    font-weight: bold;
    margin-top: 15px;
}


/* MAIN */

#mainWebsite {
    display: none;
}

.container {
    width: 92%;
    max-width: 850px;
    margin: auto;
    padding: 35px 0 60px;
    text-align: center;
}

.mainTitle {
    font-size: 42px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 18px;
    margin-bottom: 30px;
}

section {
    margin-bottom: 25px;
    padding: 25px;

    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 28px;

    box-shadow: 0 15px 40px rgba(0,0,0,0.18);
}

section h2 {
    font-size: 28px;
    margin-bottom: 20px;
}

    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}
